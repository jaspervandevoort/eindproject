spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false

# JWT configuratie voor testen (base64 encoded 32+ byte secret)
jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWZvci1pbnRlZ3JhdGlvbi10ZXN0cy1taW5pbXVtLTMyLWJ5dGVz
jwt.token.issuer=test
jwt.token.lifetime=30m

# Mail configuratie (disabled voor testen)
spring.mail.host=localhost
spring.mail.port=1025

# RabbitMQ uitschakelen voor testen
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
